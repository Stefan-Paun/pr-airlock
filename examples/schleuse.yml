# Copy to .github/workflows/schleuse.yml in your repository.
name: schleuse
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write   # only needed for comment: true; use `permissions: {}` plus contents: read otherwise
jobs:
  gate:
    name: PR poisoning gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout on purpose: the PR is read through the API as data and never executed.
      - uses: Stefan-Paun/pr-airlock@v1
        with:
          comment: true
          fail-on: block
# Optional: SARIF for the Security tab. Needs `security-events: write` and lands on the base ref under pull_request_target.
#          sarif: schleuse.sarif
